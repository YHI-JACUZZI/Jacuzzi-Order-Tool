<!DOCTYPE html>
<html lang="en">

<title>Jacuzzi Bath Remodel Configurator</title>
<!--
  ============================================================================
  JACUZZI / BATH REMODEL CONFIGURATOR  —  single-file, offline, no dependencies
  ============================================================================
  A faithful web replica of the "Selection Sheet" + "Model Numbers Output"
  logic from source.xlsx.  See spec_notes.md for the full formula extraction
  and the list of known Excel quirks that are reproduced deliberately.

  CODE MAP (search for these banners):
    SECTION A — EMBEDDED DATA           (generated by build_data.py)
    SECTION B — EXCEL FUNCTION SHIMS    (TRIM / SEARCH / COUNTIF / TEXTAFTER…)
    SECTION C — HELPER CELLS            (Selection Sheet D/E + Config R, AY…)
    SECTION D — DYNAMIC OPTION LISTS    (the x14 dropdown formulas)
    SECTION E — FIELD DEFINITIONS       (one entry per Selection Sheet row)
    SECTION F — VALIDATION              (the column C "✗" formulas)
    SECTION G — LINE ITEMS              (column F/G/I → model numbers + qty)
    SECTION H — OUTPUT ASSEMBLY         ("Model Numbers Output" sheet)
    SECTION I — RENDERING / DOM
    SECTION J — EXPORTS               (Word .docx cut sheet + model-list CSV)
    SECTION K — BOOTSTRAP

  Cell references (B6, G19, Config!R14 …) are kept in the code and comments so
  any change request phrased in Excel terms can be located quickly.
-->
<style>
/* ============================== THEME ================================== */
:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --ink:#1c2530;
  --ink-soft:#5b6874;
  --line:#dde3e9;
  --line-strong:#c4cdd6;
  --accent:#0b6fb8;
  --accent-dark:#095a95;
  --accent-soft:#e8f2fa;
  --err:#b3261e;
  --err-soft:#fdecea;
  --warn:#8a5a00;
  --warn-soft:#fff5e0;
  --ok:#1e7a46;
  --radius:8px;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
}
h1,h2,h3{margin:0; font-weight:600}

/* ============================== LAYOUT ================================= */
header.app{
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:14px 20px; position:sticky; top:0; z-index:20; box-shadow:var(--shadow);
}
.header-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{font-size:17px; font-weight:650; letter-spacing:.2px}
.brand small{display:block; font-size:11.5px; font-weight:400; color:var(--ink-soft); letter-spacing:0}
.header-actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}

.wrap{max-width:1500px; margin:0 auto; padding:16px 20px 60px}
.columns{display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,520px); gap:18px; align-items:start}
@media (max-width:1100px){ .columns{grid-template-columns:1fr} }

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px}
.card > h2{
  font-size:12.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-soft);
  padding:11px 16px; border-bottom:1px solid var(--line); background:#fbfcfd;
  border-radius:var(--radius) var(--radius) 0 0;
}
.card-body{padding:14px 16px}

/* ============================== FORM =================================== */
.job-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px}
.field{display:grid; grid-template-columns:minmax(150px,240px) minmax(0,1fr); gap:12px;
       align-items:start; padding:7px 0; border-bottom:1px solid #f0f3f6}
.field:last-child{border-bottom:none}
@media (max-width:640px){ .field{grid-template-columns:1fr; gap:4px} }
.field label{font-weight:500; padding-top:6px; color:var(--ink)}
.field label .cellref{color:#9aa7b4; font-weight:400; font-size:11px; margin-left:5px}
.control input,.control select,.job-grid input{
  width:100%; padding:7px 9px; border:1px solid var(--line-strong); border-radius:6px;
  background:#fff; color:var(--ink); font-size:14px; font-family:inherit;
}
.control select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%235b6874' stroke-width='1.6'/></svg>");
  background-repeat:no-repeat; background-position:right 9px center; padding-right:28px}
.control input:focus,.control select:focus,.job-grid input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.control input:disabled,.control select:disabled{background:#f2f4f6; color:#93a0ac; cursor:not-allowed}
.job-grid label{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin-bottom:4px}
.note{font-size:12.2px; margin-top:4px; color:var(--ink-soft)}
.note.err{color:var(--err); background:var(--err-soft); border-left:3px solid var(--err); padding:4px 8px; border-radius:0 4px 4px 0}
.note.warn{color:var(--warn); background:var(--warn-soft); border-left:3px solid var(--warn); padding:4px 8px; border-radius:0 4px 4px 0}
.field.invalid input,.field.invalid select{border-color:var(--err)}
.job-grid .job-field.invalid input{border-color:var(--err)}
.job-grid label .req{color:var(--err)}
.field.na label{color:#93a0ac}
.reference-only{font-size:11px; color:#93a0ac; font-style:italic}

/* ============================== BUTTONS ================================ */
button{
  font:inherit; font-weight:550; border-radius:6px; padding:8px 14px; cursor:pointer;
  border:1px solid var(--line-strong); background:#fff; color:var(--ink);
}
button:hover{background:#f4f7fa}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{background:var(--accent-dark)}
.btn-link{
  font:inherit; font-weight:550; border-radius:6px; padding:8px 14px; cursor:pointer;
  border:1px solid var(--line-strong); background:#fff; color:var(--ink);
  text-decoration:none; display:inline-flex; align-items:center;
}
.btn-link:hover{background:#f4f7fa}

/* ============================== RESULTS ================================ */
/* The output panel follows the user down the (long) form and scrolls internally. */
.results{position:sticky; top:78px; display:flex; flex-direction:column; max-height:calc(100vh - 100px)}
.results > h2, .results > .summary-bar{flex:0 0 auto}
#issues-box{flex:0 0 auto; max-height:26vh; overflow:auto}
#results-box{flex:1 1 auto; overflow:auto}
@media (max-width:1100px){ .results{position:static; max-height:none} }
table.models{width:100%; border-collapse:collapse; font-size:13px}
table.models th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
  color:var(--ink-soft); border-bottom:1px solid var(--line-strong); padding:7px 8px; white-space:nowrap;
}
table.models td{border-bottom:1px solid #eef1f4; padding:7px 8px; vertical-align:top}
table.models tr:last-child td{border-bottom:none}
table.models td.model{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:600; white-space:nowrap}
table.models td.qty,table.models th.qty{text-align:right; white-space:nowrap}
table.models td.cost,table.models th.cost{text-align:right; white-space:nowrap; color:var(--ink-soft)}
table.models tr.nomatch td{background:var(--err-soft)}
table.models tr.nomatch td.model{color:var(--err); font-weight:600}
table.models tr.qty-overridden td{background:var(--warn-soft)}
.qty-input{
  width:56px; text-align:right; font:inherit; font-variant-numeric:tabular-nums;
  padding:4px 6px; border:1px solid var(--line-strong); border-radius:6px; background:var(--panel);
}
.qty-input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
tr.qty-overridden .qty-input{border-color:var(--warn); background:#fffaf0}
.qty-note{font-size:10.5px; color:var(--warn); margin-top:3px; text-align:right; white-space:nowrap}
.qty-reset{
  margin-left:4px; border:none; background:none; color:var(--warn); cursor:pointer;
  font-size:12px; padding:0 2px; line-height:1; vertical-align:middle;
}
.qty-reset:hover{color:var(--accent-dark)}
.src{font-size:11px; color:#93a0ac}
.empty-state{padding:22px 16px; text-align:center; color:var(--ink-soft)}
.issues{margin:0; padding:0; list-style:none}
.issues li{font-size:12.5px; padding:6px 10px; border-radius:5px; margin-bottom:6px}
.issues li.err{background:var(--err-soft); color:var(--err)}
.issues li.warn{background:var(--warn-soft); color:var(--warn)}
.summary-bar{display:flex; gap:18px; padding:10px 16px; border-bottom:1px solid var(--line); background:#fbfcfd; font-size:12.5px; color:var(--ink-soft)}
.summary-bar b{color:var(--ink); font-size:15px; display:block; font-weight:650}
</style>
</head>

<header class="app">

</header>

          <div>Total qty<b id="sum-qty">0</b></div>
          <div>Est. cost<b id="sum-cost">—</b></div>
          <div id="sum-adjusted-wrap" style="display:none">Qty adjusted<b id="sum-adjusted">0</b></div>
        </div>
        <div id="issues-box" style="padding:12px 16px 0"></div>
        <div id="results-box"></div>
      </div>
    </div>
  </div>
</div>

/* ==========================================================================
   SECTION F.1 — SHARED ORDER HISTORY
   Every export (CSV or Word) is best-effort logged to a small Google Sheets
   "backend" (a Google Apps Script Web App bound to a Sheet — the simplest
   free way to get a shared, cross-device data store out of a plain static
   site with no server of its own). history.html reads the same endpoint to
   list past exports for the whole team.

   HISTORY_ENDPOINT is intentionally blank until that Apps Script is deployed
   — see history-backend.gs and SETUP.md shipped alongside this file. Until
   it's filled in, logging is a silent no-op and history.html shows a setup
   notice instead of erroring.
   ========================================================================== */
const HISTORY_ENDPOINT = ""; // <-- paste the deployed Apps Script Web App URL here

/** Fire-and-forget: never throws, never blocks or delays an export. Uses
 *  mode:"no-cors" (we don't need to read the response) with a text/plain
 *  body, which keeps this a CORS "simple request" — Apps Script doPost()
 *  still reads it fine via e.postData.contents regardless of the declared
 *  content type. */
function logExportToHistory(snap, exportType){
  if (!HISTORY_ENDPOINT) return;
  try {
    const payload = {
      ts: new Date().toISOString(),
      exportType: exportType,                 // "csv" | "docx"
      customer: raw(job.customer).trim(), job: raw(job.job).trim(),
      date: raw(job.date).trim(), staff: raw(job.staff).trim(),
      totalQty: snap.totalQty,
      totalCost: snap.haveCost ? snap.cost : null,
      rows: snap.rows.map(r => ({
        model: r.model, qty: r.qty,
        description: r.item ? r.item.d : (r.constructed ? "(constructed)" : ""),
        unitCost: (r.item && typeof r.item.c === "number") ? r.item.c : null
      }))
    };
    fetch(HISTORY_ENDPOINT, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(function(){ /* offline / blocked — the export itself already succeeded */ });
  } catch (e) { /* never let logging break a real export */ }
}

/** G16 / G17 share one rule: SG-<length without ">|X or G|-<valve colour>. */
function grabBarModels(s, styleCell, lengthCell, colorCell){
  const style = TRIM(styleCell), len = TRIM(lengthCell), col = TRIM(colorCell);
  if (style === "" || len === "" || col === "" || style === "N/A" || len === "N/A") return BLANK;
  const key = "SG-" + len.split("\"").join("") + (style === "Deluxe" ? "X" : "G") + "-" + col;
  return FILTER_CATALOG(it => SEARCH(key, it.m));
}

/** Numeric equality against a catalog custom field, with Excel's blank rules:
 *  a blank criterion matches blank cells only. */
function numEq(cellValue, criterion){
  if (criterion === "" || criterion === null || criterion === undefined)
    return cellValue === null || cellValue === undefined || cellValue === "";
  return Number(cellValue) === Number(criterion);
}

/** A line item that cannot be evaluated because a helper cell is an Excel error. */
function errResult(message){
  return { models:[], items:[], noMatch:false, error:message };
}

/* ==========================================================================
   SECTION H — OUTPUT ASSEMBLY  ("Model Numbers Output" sheet)
     =LET(r, FILTER(CHOOSECOLS(G6:I52, 1, 3), G6:G52<>"", "No model numbers"),
          IF(r=0, "", r&""))
   Column G spills HORIZONTALLY (every formula is wrapped in TRANSPOSE), so only
   the first match of each line item ever reaches the output.  Extra matches are
   reported as an "ambiguous" warning rather than silently dropped.
   ========================================================================== */

function computeOutput(state){
  const h = computeHelpers(state);
  const lines = [];      // one entry per Selection Sheet line-item row
  const issues = [];     // page-level warnings/errors

  for (const li of LINE_ITEMS){
    const res = li.models(state, h) || BLANK;
    const qty = li.qty ? li.qty(state, h, res) : null;
    const model = res.models.length ? res.models[0] : "";

    if (res.error) issues.push({ level:"err", text:li.label + ": " + res.error });
    if (res.models.length > 1)
      issues.push({ level:"warn", text:li.label + ": " + res.models.length +
        " catalog items match (" + res.models.join(", ") +
        "). Excel only reports the first one — narrow the selections." });
    if (res.noMatch)
      issues.push({ level:"err", text:li.label + ": no catalog item matches the current selections." });

    lines.push({
      row: li.row, label: li.label, model: model, qty: qty,
      noMatch: res.noMatch, constructed: !!res.constructed,
      item: res.items && res.items.length ? res.items[0] : null,
      noQtyInExcel: !!li.noQtyInExcel, missingFormula: !!li.missingFormula
    });
  }

  // Roll up identical SKUs, summing quantities (blank quantities stay blank).
  const bySku = new Map();
  for (const l of lines){
    if (l.model === "") continue;
    let e = bySku.get(l.model);
    if (!e){
      e = { model:l.model, item:l.item, qty:null, sources:[], noMatch:l.noMatch,
            constructed:l.constructed, noQtyInExcel:false };
      bySku.set(l.model, e);
    }
    if (l.qty !== null && l.qty !== undefined) e.qty = (e.qty || 0) + l.qty;
    else e.noQtyInExcel = true;
    e.sources.push(l.label);
    if (!e.item && l.item) e.item = l.item;
  }

  return { helpers:h, lines:lines, rows:[...bySku.values()], issues:issues };
}

/* ==========================================================================
   SECTION I — RENDERING / DOM
   Inputs are created once and then refreshed in place (so typing in a number
   field never loses focus).  `state` holds raw Selection Sheet cell values.
   ========================================================================== */

const state = {};                                   // { "B6": "Tub", ... }
const job = {};                                     // { customer, job, date, staff }
const els = {};                                     // { "B6": {wrap,input,note,...} }
let lastOutput = null;

/* Manual quantity overrides, keyed by Model Number (SKU). Layered on top of
 * computeOutput()'s calculated quantities so the engine itself stays a pure
 * translation of the Excel logic — overrides are purely a UI/export concern.
 * Kept keyed by SKU (not row index) so an override "sticks" to that product:
 * if you change an unrelated selection, quantities you've already adjusted
 * don't get silently reset. If the SKU disappears entirely from the results
 * (a selection change swaps it out), the stale override is simply unused. */
const qtyOverrides = new Map();

/** Mutates out.rows in place: applies any manual override, and records the
 *  Excel-calculated value as r.calculatedQty so the UI can show "(calc: N)"
 *  and offer a per-row reset. Always call this instead of using
 *  computeOutput()'s return value directly for rendering or export. */
function applyQtyOverrides(out){
  for (const r of out.rows){
    r.calculatedQty = r.qty;
    if (qtyOverrides.has(r.model)){
      r.qty = qtyOverrides.get(r.model);
      r.overridden = true;
    } else {
      r.overridden = false;
    }
  }
  return out;
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* --------------------------------------------------------- job header --- */
let jobExportAttempted = false;    // set true on the first blocked export click

function buildJobFields(){
  const grid = document.getElementById("job-grid");
  for (const f of JOB_FIELDS){
    const box = el("div", "job-field");
    const lab = el("label");
    lab.appendChild(document.createTextNode(f.label));
    if (f.required) lab.appendChild(el("span", "req", " *"));
    const inp = el("input");
    inp.type = f.type || "text";
    inp.id = "job-" + f.key;
    inp.addEventListener("input", () => { job[f.key] = inp.value; refreshJobValidation(); });
    inp.addEventListener("blur", () => { inp.dataset.touched = "1"; refreshJobValidation(); });
    const note = el("div", "note");
    note.style.display = "none";
    box.appendChild(lab); box.appendChild(inp); box.appendChild(note);
    grid.appendChild(box);
    els["job-" + f.key] = inp;
    els["job-" + f.key + "-box"] = box;
    els["job-" + f.key + "-note"] = note;
  }
  // Default the date to today for convenience.
  const d = new Date();
  const iso = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  els["job-date"].value = iso; job.date = iso;
}

/** True when a required job field is currently blank. */
function jobFieldMissing(f){
  return !!f.required && raw(job[f.key]).trim() === "";
}

/** Re-decorates the job header inputs. A field is only shown red/flagged
 *  once the user has left it blank (blur) or an export was attempted while
 *  it was blank — so the form doesn't look like an error page on first
 *  load. Always returns the current list of missing required labels. */
function refreshJobValidation(){
  const missing = [];
  for (const f of JOB_FIELDS){
    const bad = jobFieldMissing(f);
    if (bad) missing.push(f.label);
    const box = els["job-" + f.key + "-box"];
    const note = els["job-" + f.key + "-note"];
    const inp = els["job-" + f.key];
    const show = bad && (jobExportAttempted || inp.dataset.touched === "1");
    if (box) box.classList.toggle("invalid", show);
    if (note){
      note.className = "note" + (show ? " err" : "");
      note.textContent = show ? "Required before export." : "";
      note.style.display = show ? "" : "none";
    }
  }
  return missing;
}

/** Gate for both export buttons: marks every blank required field, shows a
 *  single summary alert naming what's missing, and focuses the first one.
 *  Returns true only when the job header is complete. */
function requireJobFields(){
  jobExportAttempted = true;
  const missing = refreshJobValidation();
  if (missing.length){
    alert("Please fill in the required field" + (missing.length > 1 ? "s" : "") +
          " before exporting: " + missing.join(", ") + ".");
    const firstBad = JOB_FIELDS.find(f => jobFieldMissing(f));
    if (firstBad) els["job-" + firstBad.key].focus();
    return false;
  }
  return true;
}

/* ------------------------------------------------------- form section --- */
function buildForm(){
  const col = document.getElementById("form-col");
  col.innerHTML = "";
  for (const section of SECTIONS){
    const fields = FIELDS.filter(f => f.section === section);
    if (!fields.length) continue;
    const card = el("div", "card");
    card.appendChild(el("h2", null, section));
    const body = el("div", "card-body");
    for (const f of fields) body.appendChild(buildField(f));
    card.appendChild(body);
    col.appendChild(card);
  }
}

function buildField(f){
  const wrap = el("div", "field");
  const lab = el("label", null, f.label);
  const ref = el("span", "cellref", f.cell);
  lab.appendChild(ref);
  lab.htmlFor = "in-" + f.cell;

  const control = el("div", "control");
  let input;
  if (f.type === "select"){
    input = el("select");
  } else {
    input = el("input");
    input.type = f.type === "number" ? "number" : "text";
    if (f.type === "number") input.step = "any";
  }
  input.id = "in-" + f.cell;
  input.addEventListener("change", () => onFieldChange(f, input.value));
  input.addEventListener("input",  () => onFieldChange(f, input.value));
  control.appendChild(input);

  const note = el("div", "note");
  note.style.display = "none";
  control.appendChild(note);

  if (f.unused) control.appendChild(el("div", "reference-only", "Reference only — not used by any model number formula."));
  if (f.hint)   control.appendChild(el("div", "note", f.hint));

  wrap.appendChild(lab); wrap.appendChild(control);
  els[f.cell] = { wrap, input, note, def:f, optionsKey:null };
  return wrap;
}

function onFieldChange(f, value){
  state[f.cell] = value;
  // Convenience: keep the silicone colour in step with the back wall colour
  // (the Excel has no formula there — see spec_notes.md "Approximations" #1).
  if (f.cell === "B10"){
    const auto = siliconeForWallColor(state);
    if (auto) state.B50 = auto;
  }
  refresh();
}

/** Re-evaluate every dropdown, note and validation message, then the output. */
function refresh(){
  const h = computeHelpers(state);

  for (const f of FIELDS){
    const E = els[f.cell];
    const current = raw(state[f.cell]);

    if (f.type === "select"){
      const opts = (f.options ? f.options(state, h) : []) || [];
      const stale = current !== "" && !INLIST(opts, current);
      const key = JSON.stringify(opts) + "|" + (stale ? current : "");
      if (key !== E.optionsKey){
        E.optionsKey = key;
        E.input.innerHTML = "";
        E.input.appendChild(new Option("— select —", ""));
        for (const o of opts) E.input.appendChild(new Option(raw(o).trim() || raw(o), raw(o)));
        if (stale) E.input.appendChild(new Option(current + "  (not available now)", current));
      }
      E.input.value = current;
      const disabled = opts.length === 0;
      E.input.disabled = disabled;
      E.wrap.classList.toggle("na", disabled);
      E.naMessage = disabled ? notApplicableMessage(f, state) : null;
      E.staleMessage = stale ? "“" + current + "” is not offered for the current selections." : null;
    } else {
      if (document.activeElement !== E.input) E.input.value = current;
      E.naMessage = null; E.staleMessage = null;
    }

    // Column C "✗" check → friendly message
    const vmsg = f.validate ? f.validate(state, h) : null;
    const msg = vmsg || E.staleMessage || E.naMessage;
    const level = vmsg ? "err" : (E.staleMessage ? "warn" : "note");
    E.note.className = "note" + (msg && level !== "note" ? " " + level : "");
    E.note.textContent = msg || "";
    E.note.style.display = msg ? "" : "none";
    E.wrap.classList.toggle("invalid", !!vmsg);
  }

  lastOutput = applyQtyOverrides(computeOutput(state));
  renderResults(lastOutput);
}

/** Friendly explanation for a dropdown whose Excel source resolves to nothing. */
function notApplicableMessage(f, s){
  switch (f.cell){
    case "B10": case "B11": return "Choose a Wall System Type first.";
    case "B26": return "Choose a stock tub or shower pan type first.";
    case "B29": return "Only applies to a Stock Acrylic Bathtub.";
    case "B30": return "Choose a tub / pan dimension first.";
    case "B40": return "Only applies when the seat is “Bench wrap and top”.";
    case "B39": return "Choose a seat style first.";
    case "B42": return "Choose Grab Bar 1 Style first.";
    case "B44": return "Choose Grab Bar 2 Style first.";
    default:    return "Not applicable for this configuration.";
  }
}

/** Builds the editable Qty <td> for one results row. Uses a "change" listener
 *  (fires on blur / Enter, not every keystroke) rather than "input", so the
 *  table can safely rebuild on every edit without booting focus mid-type —
 *  same reasoning as the "no live rebuild while typing" rule used for the
 *  Selection Sheet form fields, just solved the simpler way since this table
 *  is small and quantity edits are infrequent one-off keystrokes. */
function qtyCell(r){
  const td = el("td", "qty");

  const input = document.createElement("input");
  input.type = "number"; input.min = "0"; input.step = "1";
  input.className = "qty-input";
  input.value = r.qty === null ? "" : String(r.qty);
  input.placeholder = "0";
  input.title = "Adjust quantity before export";
  input.addEventListener("change", function(){
    const raw = input.value.trim();
    if (raw === ""){ qtyOverrides.delete(r.model); refresh(); return; }
    const n = Math.round(Number(raw));
    if (!isFinite(n) || n < 0){ input.value = r.qty === null ? "" : String(r.qty); return; }
    qtyOverrides.set(r.model, n);
    refresh();
  });
  input.addEventListener("keydown", function(ev){ if (ev.key === "Enter") input.blur(); });
  td.appendChild(input);

  if (r.overridden){
    const note = el("div", "qty-note", "calc: " + (r.calculatedQty === null ? "—" : r.calculatedQty));
    const reset = document.createElement("button");
    reset.type = "button"; reset.className = "qty-reset"; reset.textContent = "↺";
    reset.title = "Reset to calculated quantity";
    reset.addEventListener("click", function(){ qtyOverrides.delete(r.model); refresh(); });
    note.appendChild(reset);
    td.appendChild(note);
  }
  return td;
}

function renderResults(out){
  const box = document.getElementById("results-box");
  const issuesBox = document.getElementById("issues-box");
  box.innerHTML = ""; issuesBox.innerHTML = "";

  // Page-level issues
  if (out.issues.length){
    const ul = el("ul", "issues");
    for (const i of out.issues) ul.appendChild(el("li", i.level, i.text));
    issuesBox.appendChild(ul);
  }

  if (!out.rows.length){
    box.appendChild(el("div", "empty-state", "Make selections on the left — model numbers appear here as soon as a line item resolves."));
  } else {
    const t = el("table", "models");
    const thead = el("thead");
    const hr = el("tr");
    ["Model number","Description","Qty","Unit cost"].forEach((label, i) => {
      const th = el("th", i === 2 ? "qty" : (i === 3 ? "cost" : null), label);
      hr.appendChild(th);
    });
    thead.appendChild(hr); t.appendChild(thead);

    const tb = el("tbody");
    for (const r of out.rows){
      const tr = el("tr", (r.noMatch ? "nomatch" : "") + (r.overridden ? " qty-overridden" : ""));
      tr.appendChild(el("td", "model", r.model));

      const dcell = el("td");
      dcell.appendChild(document.createTextNode(
        r.noMatch ? "Check the selections for this line item"
                  : (r.item ? r.item.d : (r.constructed ? "(built from the selections — not a catalog lookup)" : ""))));
      const src = el("div", "src", r.sources.join(", ") + (r.noQtyInExcel ? " · no quantity set in the Excel" : ""));
      dcell.appendChild(src);
      tr.appendChild(dcell);

      tr.appendChild(qtyCell(r));
      const unit = (r.item && typeof r.item.c === "number") ? r.item.c : null;
      tr.appendChild(el("td", "cost", unit === null ? "" : money(unit)));
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    box.appendChild(t);
  }

  // Summary bar
  const totalQty = out.rows.reduce((a, r) => a + (r.qty || 0), 0);
  let cost = 0, haveCost = false;
  for (const r of out.rows){
    if (r.item && typeof r.item.c === "number" && r.qty){ cost += r.item.c * r.qty; haveCost = true; }
  }
  document.getElementById("sum-lines").textContent = String(out.lines.filter(l => l.model !== "").length);
  document.getElementById("sum-skus").textContent  = String(out.rows.length);
  document.getElementById("sum-qty").textContent   = String(totalQty);
  document.getElementById("sum-cost").textContent  = haveCost ? money(cost) : "—";

  const adjustedCount = out.rows.filter(r => r.overridden).length;
  document.getElementById("sum-adjusted-wrap").style.display = adjustedCount ? "" : "none";
  document.getElementById("sum-adjusted").textContent = String(adjustedCount);
}

function money(n){ return "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* ==========================================================================
   SECTION J — EXPORTS
   Two export buttons, both fed by ONE snapshot of the app state
   (`exportSnapshot()` → `lastOutput` + `state` + `job`) so the Word cut sheet
   and the CSV order list can never disagree with each other or with the
   on-screen results table.

     * Export Cut Sheet (Word)  → a real .docx (OOXML zip) built by hand below.
     * Export Model List (CSV)  → Model Number + Quantity only, UTF-8 + BOM.

   The .docx writer is deliberately dependency-free: a .docx is just a ZIP of
   XML parts, and ZIP entries may be STORED (uncompressed), so no deflate
   implementation is needed — see `zipStore()`.
   ========================================================================== */

/* ------------------------------------------------------------------------
   J.1 — Shared snapshot: the single source of truth for both exports.
   ------------------------------------------------------------------------ */

function exportSnapshot(){
  const out = lastOutput || applyQtyOverrides(computeOutput(state));

  // Job reference header, in the order the form shows it.
  const jobInfo = JOB_FIELDS.map(f => ({ label:f.label, value: raw(job[f.key]).trim() }));

  // Every answered selection, grouped by the UI's own section banners and
  // kept in FIELDS order (which is Selection Sheet row order).
  const sections = [];
  const bySection = new Map();
  for (const f of FIELDS){
    const v = raw(state[f.cell]).trim();
    if (v === "") continue;
    let sec = bySection.get(f.section);
    if (!sec){ sec = { name:f.section, fields:[] }; bySection.set(f.section, sec); sections.push(sec); }
    sec.fields.push({ label:f.label, cell:f.cell, value:v });
  }

  // Roll-up totals — same arithmetic as the on-screen summary bar.
  let totalQty = 0, cost = 0, haveCost = false;
  for (const r of out.rows){
    if (r.qty) totalQty += r.qty;
    if (r.item && typeof r.item.c === "number" && r.qty){ cost += r.item.c * r.qty; haveCost = true; }
  }

  return {
    out: out, rows: out.rows, issues: out.issues,
    jobInfo: jobInfo, sections: sections,
    stamp: new Date(), totalQty: totalQty, cost: cost, haveCost: haveCost
  };
}

/** `20260813-1432` — used as a fallback in both export filenames when no customer name is set. */
function exportStamp(d){
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}

/** Builds "<prefix> <Customer Name>.<ext>", falling back to a timestamp when the
 *  Customer name field is blank. Strips characters that aren't safe in filenames
 *  (Windows-reserved chars in particular, since these get opened from a shared
 *  drive) and collapses whitespace. */
function exportFileName(prefix, snap, ext){
  const cleaned = String(job.customer || "").trim().replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ");
  const who = cleaned || exportStamp(snap.stamp);
  return prefix + " " + who + "." + ext;
}

/** Shared Blob + <a download> download path (unchanged from the original CSV export). */
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

/* ------------------------------------------------------------------------
   J.2 — Export Model List (CSV): Model Number + Quantity, nothing else.
   ------------------------------------------------------------------------ */

function csvCell(v){
  const s = (v === null || v === undefined) ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.split('"').join('""') + '"' : s;
}
function csvRow(arr){ return arr.map(csvCell).join(",") + "\r\n"; }

/** Two columns only. Duplicate SKUs are already merged/summed by computeOutput(). */
function buildModelListCsv(snap){
  let csv = csvRow(["Model Number", "Quantity"]);
  for (const r of snap.rows) csv += csvRow([r.model, r.qty === null ? "" : r.qty]);
  return csv;
}

function exportModelListCsv(){
  if (!requireJobFields()) return;
  const snap = exportSnapshot();
  const csv = "﻿" + buildModelListCsv(snap);          // UTF-8 BOM for Excel
  downloadBlob(new Blob([csv], { type:"text/csv;charset=utf-8;" }),
               exportFileName("Model Numbers", snap, "csv"));
  logExportToHistory(snap, "csv");
}

/* ------------------------------------------------------------------------
   J.3 — Minimal ZIP writer (STORE / no compression).
   Word opens uncompressed OOXML packages happily, which lets us skip a
   deflate implementation entirely. CRC-32 and the three record types
   (local header / central directory / EOCD) must be byte-exact.
   ------------------------------------------------------------------------ */

const CRC32_TABLE = (function(){
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/**
 * @param {{name:string, data:string}[]} files  part name → UTF-8 text content
 * @param {Date} date                            timestamp stamped into each entry
 * @returns {Uint8Array}                         a complete .zip archive
 */
function zipStore(files, date){
  const enc = new TextEncoder();

  // MS-DOS packed time/date (2-second resolution, epoch 1980).
  const dosTime = ((date.getHours() & 31) << 11) | ((date.getMinutes() & 63) << 5) |
                  (Math.floor(date.getSeconds() / 2) & 31);
  const year    = Math.max(1980, date.getFullYear());
  const dosDate = (((year - 1980) & 127) << 9) | (((date.getMonth() + 1) & 15) << 5) |
                  (date.getDate() & 31);

  const entries = [];
  let localSize = 0, cdSize = 0;
  for (const f of files){
    const name = enc.encode(f.name);
    const data = enc.encode(f.data);
    entries.push({ name:name, data:data, crc:crc32(data), offset:localSize });
    localSize += 30 + name.length + data.length;   // local header + name + payload
    cdSize    += 46 + name.length;                 // central directory record + name
  }

  const buf = new Uint8Array(localSize + cdSize + 22);   // + end-of-central-directory
  const dv  = new DataView(buf.buffer);
  let p = 0;
  const u16 = v => { dv.setUint16(p, v & 0xFFFF, true); p += 2; };
  const u32 = v => { dv.setUint32(p, v >>> 0, true);    p += 4; };
  const raw8 = b => { buf.set(b, p); p += b.length; };

  // --- local file headers + payloads ---
  for (const e of entries){
    u32(0x04034b50);                 // signature
    u16(20);                         // version needed to extract (2.0)
    u16(0);                          // general purpose flags (names are ASCII)
    u16(0);                          // compression method: 0 = STORE
    u16(dosTime); u16(dosDate);
    u32(e.crc); u32(e.data.length); u32(e.data.length);
    u16(e.name.length); u16(0);      // file name length / extra field length
    raw8(e.name); raw8(e.data);
  }

  // --- central directory ---
  const cdStart = p;
  for (const e of entries){
    u32(0x02014b50);                 // signature
    u16(20);                         // version made by
    u16(20);                         // version needed to extract
    u16(0); u16(0);                  // flags / method (STORE)
    u16(dosTime); u16(dosDate);
    u32(e.crc); u32(e.data.length); u32(e.data.length);
    u16(e.name.length); u16(0); u16(0);   // name / extra / comment lengths
    u16(0);                          // disk number start
    u16(0); u32(0);                  // internal / external file attributes
    u32(e.offset);                   // relative offset of local header
    raw8(e.name);
  }
  const cdEnd = p;

  // --- end of central directory ---
  u32(0x06054b50);
  u16(0); u16(0);                    // this disk / disk with start of CD
  u16(entries.length); u16(entries.length);
  u32(cdEnd - cdStart); u32(cdStart);
  u16(0);                            // .zip file comment length

  return buf;
}

/* ------------------------------------------------------------------------
   J.4 — WordprocessingML builders.
   Element ordering inside <w:rPr>/<w:pPr>/<w:tblPr>/<w:tcPr> follows the
   OOXML schema sequence — Word rejects documents that get it wrong.
   ------------------------------------------------------------------------ */

function xmlEsc(v){
  return raw(v)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")   // not representable in XML 1.0
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/** A text run. opts: {b, i, color:"RRGGBB", sz:<half-points>, mono:true} */
function wRun(text, opts){
  opts = opts || {};
  let pr = "";
  if (opts.mono)  pr += '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:cs="Consolas"/>';
  if (opts.b)     pr += "<w:b/>";
  if (opts.i)     pr += "<w:i/>";
  if (opts.color) pr += '<w:color w:val="' + opts.color + '"/>';
  if (opts.sz)    pr += '<w:sz w:val="' + opts.sz + '"/><w:szCs w:val="' + opts.sz + '"/>';
  return "<w:r>" + (pr ? "<w:rPr>" + pr + "</w:rPr>" : "") +
         '<w:t xml:space="preserve">' + xmlEsc(text) + "</w:t></w:r>";
}

/** A paragraph. opts: {style, jc, before, after, keepNext} */
function wPara(runs, opts){
  opts = opts || {};
  const body = Array.isArray(runs) ? runs.join("") : (runs || "");
  let pr = "";
  if (opts.style)    pr += '<w:pStyle w:val="' + opts.style + '"/>';
  if (opts.keepNext) pr += "<w:keepNext/>";
  if (opts.before !== undefined || opts.after !== undefined){
    pr += "<w:spacing" + (opts.before !== undefined ? ' w:before="' + opts.before + '"' : "") +
          (opts.after !== undefined ? ' w:after="' + opts.after + '"' : "") + "/>";
  }
  if (opts.jc) pr += '<w:jc w:val="' + opts.jc + '"/>';
  return "<w:p>" + (pr ? "<w:pPr>" + pr + "</w:pPr>" : "") + body + "</w:p>";
}

/** A table cell. opts: {w:<twips>, shade:"RRGGBB", jc} — content is plain text. */
function wCell(text, opts){
  opts = opts || {};
  let pr = '<w:tcW w:w="' + (opts.w || 0) + '" w:type="' + (opts.w ? "dxa" : "auto") + '"/>';
  if (opts.shade) pr += '<w:shd w:val="clear" w:color="auto" w:fill="' + opts.shade + '"/>';
  pr += '<w:vAlign w:val="center"/>';
  const para = wPara(wRun(text, opts), { jc: opts.jc, after: 20 });
  return "<w:tc><w:tcPr>" + pr + "</w:tcPr>" + para + "</w:tc>";
}

/** A table row. `header` marks it as a repeating heading row when printed. */
function wRow(cells, header){
  return "<w:tr>" + (header ? "<w:trPr><w:tblHeader/></w:trPr>" : "") + cells.join("") + "</w:tr>";
}

/** A bordered, fixed-layout table. `widths` are twips and drive the grid. */
function wTable(rows, widths){
  const grid = widths.map(w => '<w:gridCol w:w="' + w + '"/>').join("");
  const borders = ["top","left","bottom","right","insideH","insideV"]
    .map(s => "<w:" + s + ' w:val="single" w:sz="4" w:space="0" w:color="C4CDD6"/>').join("");
  return "<w:tbl><w:tblPr>" +
           '<w:tblW w:w="' + widths.reduce((a,b) => a+b, 0) + '" w:type="dxa"/>' +
           "<w:tblBorders>" + borders + "</w:tblBorders>" +
           '<w:tblLayout w:type="fixed"/>' +
           '<w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="80" w:type="dxa"/>' +
           '<w:bottom w:w="40" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar>' +
         "</w:tblPr><w:tblGrid>" + grid + "</w:tblGrid>" + rows.join("") + "</w:tbl>";
}

/* ------------------------------------------------------------------------
   J.5 — The cut sheet document itself.
   ------------------------------------------------------------------------ */

const DOCX_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';

const DOCX_CONTENT_TYPES = DOCX_HEAD +
  '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
  '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
  '<Default Extension="xml" ContentType="application/xml"/>' +
  '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
  '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
  '</Types>';

const DOCX_ROOT_RELS = DOCX_HEAD +
  '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
  '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
  '</Relationships>';

const DOCX_DOC_RELS = DOCX_HEAD +
  '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
  '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
  '</Relationships>';

const DOCX_STYLES = DOCX_HEAD +
  '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    "<w:docDefaults>" +
      "<w:rPrDefault><w:rPr>" +
        '<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>' +
        '<w:sz w:val="19"/><w:szCs w:val="19"/>' +
      "</w:rPr></w:rPrDefault>" +
      '<w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault>' +
    "</w:docDefaults>" +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal">' +
      '<w:name w:val="Normal"/><w:qFormat/></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/>' +
      '<w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/>' +
      '<w:pPr><w:spacing w:after="0"/></w:pPr>' +
      '<w:rPr><w:b/><w:color w:val="0B6FB8"/><w:sz w:val="40"/><w:szCs w:val="40"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/>' +
      '<w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/>' +
      '<w:pPr><w:keepNext/><w:spacing w:before="280" w:after="100"/></w:pPr>' +
      '<w:rPr><w:b/><w:color w:val="0B6FB8"/><w:sz w:val="26"/><w:szCs w:val="26"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/>' +
      '<w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/>' +
      '<w:pPr><w:keepNext/><w:spacing w:before="180" w:after="60"/></w:pPr>' +
      '<w:rPr><w:b/><w:color w:val="1C2530"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:style>' +
  "</w:styles>";

const DOCX_SECT_PR =
  '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/>' +
  '<w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" ' +
  'w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>';

const HEAD_SHADE = "E8F2FA";   // matches the app's --accent-soft
const LBL_SHADE  = "F7F9FB";

/** Builds `word/document.xml` for the cut sheet from a snapshot. */
function buildCutSheetXml(snap){
  const b = [];
  const money2 = n => "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

  /* ---------- title block ---------- */
  b.push(wPara(wRun("Bath Remodel — Cut Sheet", {}), { style:"Title" }));
  b.push(wPara(wRun("Complete job reference · generated " + snap.stamp.toLocaleString(),
                    { i:true, color:"5B6874" }), { after:160 }));

  /* ---------- job information ---------- */
  b.push(wPara(wRun("Job Information"), { style:"Heading1" }));
  const jobRows = [wRow([ wCell("Field",  { w:3200, shade:HEAD_SHADE, b:true }),
                          wCell("Value",  { w:6880, shade:HEAD_SHADE, b:true }) ], true)];
  for (const f of snap.jobInfo){
    jobRows.push(wRow([ wCell(f.label, { w:3200, shade:LBL_SHADE }),
                        wCell(f.value || "—", { w:6880, b:!!f.value }) ]));
  }
  b.push(wTable(jobRows, [3200, 6880]));

  /* ---------- selections, grouped exactly like the UI ---------- */
  b.push(wPara(wRun("Selections"), { style:"Heading1" }));
  if (!snap.sections.length){
    b.push(wPara(wRun("No selections have been made yet.", { i:true, color:"5B6874" })));
  } else {
    for (const sec of snap.sections){
      b.push(wPara(wRun(sec.name), { style:"Heading2" }));
      const rows = [wRow([ wCell("Field", { w:3800, shade:HEAD_SHADE, b:true }),
                           wCell("Cell",  { w:900,  shade:HEAD_SHADE, b:true }),
                           wCell("Selection", { w:5380, shade:HEAD_SHADE, b:true }) ], true)];
      for (const f of sec.fields){
        rows.push(wRow([ wCell(f.label, { w:3800, shade:LBL_SHADE }),
                         wCell(f.cell,  { w:900, color:"93A0AC", mono:true }),
                         wCell(f.value, { w:5380, b:true }) ]));
      }
      b.push(wTable(rows, [3800, 900, 5380]));
    }
  }

  /* ---------- computed product list ---------- */
  b.push(wPara(wRun("Product List"), { style:"Heading1" }));
  if (!snap.rows.length){
    b.push(wPara(wRun("No product lines have been computed yet.", { i:true, color:"5B6874" })));
  } else {
    const W = [1900, 3100, 700, 1000, 1080, 2300];   // sums to 10080 = printable width
    const rows = [wRow([
      wCell("Model Number", { w:W[0], shade:HEAD_SHADE, b:true }),
      wCell("Description",  { w:W[1], shade:HEAD_SHADE, b:true }),
      wCell("Qty",          { w:W[2], shade:HEAD_SHADE, b:true, jc:"right" }),
      wCell("Unit Cost",    { w:W[3], shade:HEAD_SHADE, b:true, jc:"right" }),
      wCell("Extended",     { w:W[4], shade:HEAD_SHADE, b:true, jc:"right" }),
      wCell("Source Line(s)", { w:W[5], shade:HEAD_SHADE, b:true })
    ], true)];

    for (const r of snap.rows){
      const unit = (r.item && typeof r.item.c === "number") ? r.item.c : null;
      const ext  = (unit !== null && r.qty) ? unit * r.qty : null;
      rows.push(wRow([
        wCell(r.model, { w:W[0], mono:true, b:true, color: r.noMatch ? "B3261E" : null }),
        wCell(r.noMatch ? "Check the selections for this line item"
                        : (r.item ? r.item.d : ""), { w:W[1], i:r.noMatch }),
        wCell(r.qty === null ? "—" : String(r.qty), { w:W[2], jc:"right" }),
        wCell(unit === null ? "" : money2(unit), { w:W[3], jc:"right" }),
        wCell(ext  === null ? "" : money2(ext),  { w:W[4], jc:"right" }),
        wCell(r.sources.join(", "), { w:W[5], color:"5B6874" })
      ]));
    }

    // Totals band.
    rows.push(wRow([
      wCell("TOTAL", { w:W[0], b:true, shade:LBL_SHADE }),
      wCell(snap.rows.length + " distinct SKU" + (snap.rows.length === 1 ? "" : "s"),
            { w:W[1], shade:LBL_SHADE, color:"5B6874" }),
      wCell(String(snap.totalQty), { w:W[2], b:true, jc:"right", shade:LBL_SHADE }),
      wCell("", { w:W[3], shade:LBL_SHADE }),
      wCell(snap.haveCost ? money2(snap.cost) : "—", { w:W[4], b:true, jc:"right", shade:LBL_SHADE }),
      wCell("", { w:W[5], shade:LBL_SHADE })
    ]));
    b.push(wTable(rows, W));
  }

  /* ---------- outstanding issues, if any ---------- */
  if (snap.issues && snap.issues.length){
    b.push(wPara(wRun("Issues To Review"), { style:"Heading1" }));
    for (const i of snap.issues){
      b.push(wPara(wRun((i.level === "err" ? "ERROR — " : "WARNING — ") + i.text,
                        { color: i.level === "err" ? "B3261E" : "8A5A00" }), { after:40 }));
    }
  }

  b.push(wPara(wRun("Estimated costs are catalog list prices and exclude tax, freight and labor.",
                    { i:true, color:"93A0AC", sz:16 }), { before:240 }));

  return DOCX_HEAD +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    "<w:body>" + b.join("") + DOCX_SECT_PR + "</w:body></w:document>";
}

/** Assembles the whole OOXML package. Returns a Uint8Array of .docx bytes. */
function buildCutSheetDocx(snap){
  return zipStore([
    { name:"[Content_Types].xml",        data: DOCX_CONTENT_TYPES },
    { name:"_rels/.rels",                data: DOCX_ROOT_RELS },
    { name:"word/document.xml",          data: buildCutSheetXml(snap) },
    { name:"word/_rels/document.xml.rels", data: DOCX_DOC_RELS },
    { name:"word/styles.xml",            data: DOCX_STYLES }
  ], snap.stamp);
}

function exportCutSheetDocx(){
  if (!requireJobFields()) return;
  const snap = exportSnapshot();
  const bytes = buildCutSheetDocx(snap);
  downloadBlob(new Blob([bytes], {
    type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  }), exportFileName("Cut Sheet", snap, "docx"));
  logExportToHistory(snap, "docx");
}

/* ==========================================================================
   SECTION K — BOOTSTRAP
   ========================================================================== */

function resetForm(){
  for (const k of Object.keys(state)) delete state[k];
  for (const f of FIELDS){ const E = els[f.cell]; if (E){ E.optionsKey = null; E.input.value = ""; } }
  qtyOverrides.clear();
  refresh();
}

document.addEventListener("DOMContentLoaded", function(){
  buildJobFields();
  buildForm();
  refresh();
  document.getElementById("btn-export-docx").addEventListener("click", exportCutSheetDocx);
  document.getElementById("btn-export-csv").addEventListener("click", exportModelListCsv);
  document.getElementById("btn-reset-qty").addEventListener("click", function(){
    if (qtyOverrides.size === 0) return;
    qtyOverrides.clear();
    refresh();
  });
  document.getElementById("btn-reset").addEventListener("click", function(){
    if (confirm("Clear all configurator selections? (Job reference fields are kept.)")) resetForm();
  });
});

/* Exposed for the node test harness (test_engine.js); harmless in a browser. */
if (typeof module !== "undefined" && module.exports){
  module.exports = { CONFIG, CATALOG, computeOutput, computeHelpers, FIELDS, LINE_ITEMS,
                     doorRodOptions, seatTopOptions, panDimensionOptions,
                     zipStore, crc32, buildCutSheetXml, buildCutSheetDocx, buildModelListCsv,
                     applyQtyOverrides, qtyOverrides };
}
</script>
